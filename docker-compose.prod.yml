# Production stack. Five services, one VM.
#
#   docker compose -f docker-compose.prod.yml --env-file .env up -d
#
# Only Caddy publishes ports; Postgres and MinIO are reachable solely over the
# internal compose network, so neither is exposed to the internet.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # certificates — losing this re-issues them
      - caddy-config:/config
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      S3_DOMAIN: ${S3_DOMAIN}
    depends_on:
      - web
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # The mounted block volume, not the boot disk.
      - /data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      # MinIO does not implement the S3 PutBucketCors API — CORS lives here.
      # Presigned uploads PUT cross-origin from the browser, so without this
      # every upload fails with an opaque network error.
      MINIO_API_CORS_ALLOW_ORIGIN: "https://${APP_DOMAIN}"
      MINIO_BROWSER: "off"
    volumes:
      - /data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  web:
    image: ${ECR_REGISTRY}/loredex-repo:${IMAGE_TAG}
    restart: unless-stopped
    env_file: .env
    environment: &app-env
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Internal for server-side reads; public for URLs the browser will hit.
      # Signing with the wrong host produces a signature storage rejects.
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: https://${S3_DOMAIN}
      S3_FORCE_PATH_STYLE: "true"
      NEXT_PUBLIC_APP_URL: https://${APP_DOMAIN}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging: *logging

  worker:
    image: ${ECR_REGISTRY}/loredex-repo:${IMAGE_TAG}
    command: ["node", "jobs/worker.js"]
    restart: unless-stopped
    env_file: .env
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    # LibreOffice on a large .pptx is memory-hungry; the cap stops one bad
    # conversion from taking the whole VM down with it.
    mem_limit: 3g
    logging: *logging

volumes:
  caddy-data:
  caddy-config:
